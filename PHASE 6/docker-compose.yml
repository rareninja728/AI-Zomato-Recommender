version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: PHASE 6/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./PHASE 1/zomato.db:/app/PHASE 1/zomato.db
      - ./PHASE 5/analytics.db:/app/analytics.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: PHASE 6/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
