<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato AI Recommendations | Find Your Perfect Bite</title>
    <meta name="description" content="Discover highly personalized Zomato restaurant recommendations powered by Llama 3 AI.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <main class="container">
        <header class="header">
            <h1 class="gradient-text">Zomato AI <span class="ai-badge">Recommender</span></h1>
            <p class="subtitle">Helping you find the best places to eat in Bangalore city...</p>
        </header>

        <div class="app-grid">
            <!-- Left Side: Input Form -->
            <section class="glass-panel search-section">
                <h2>Your Preferences</h2>
                <form id="recommendation-form">
                    
                    <div class="form-group">
                        <label for="location">Location</label>
                        <div class="select-wrapper">
                            <select id="location" name="location" required>
                                <option value="" disabled selected>Loading locations...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cuisine">Primary Cuisine</label>
                        <div class="select-wrapper">
                            <select id="cuisine" name="cuisine" required>
                                <option value="" disabled selected>Loading cuisines...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="min_rating">Min Rating <span id="rating-val" class="slider-val">4.0</span></label>
                            <input type="range" id="min_rating" name="min_rating" min="1.0" max="5.0" step="0.1" value="4.0">
                        </div>

                        <div class="form-group">
                            <label for="max_price">Max Budget <span class="slider-val">₹<span id="price-val">1000</span></span></label>
                            <input type="range" id="max_price" name="max_price" min="100" max="10000" step="100" value="1000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="optional_preferences">Your Vibe</label>
                        <textarea id="optional_preferences" name="optional_preferences" rows="3" placeholder="e.g. 'A quiet place for a romantic anniversary date, not too crowded.'"></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="primary-btn">
                        <span class="btn-text">Get Recommendations</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                    <p id="error-message" class="error-text hidden"></p>
                </form>
            </section>

            <!-- Right Side: Results (Initially Hidden) -->
            <section class="results-section hidden">
                <div id="results-container" class="results-container">
                    <div class="empty-state">
                        <div class="empty-icon">✨</div>
                        <h3>Awaiting your taste</h3>
                        <p>Fill out the form and let our AI curate the finest dining experiences for you.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
